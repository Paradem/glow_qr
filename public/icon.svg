<svg width="512" height="512" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff00ff"/>
      <stop offset="100%" style="stop-color:#ff6600"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#0a0a0f"/>
  <!-- Glow effect -->
  <circle cx="256" cy="280" r="140" fill="url(#glow)" filter="url(#blur)" opacity="0.4"/>
  <!-- QR Code circle -->
  <circle cx="256" cy="280" r="120" fill="#1a1a24" stroke="url(#glow)" stroke-width="8"/>
  <!-- Sparkle G -->
  <text x="256" y="320" font-family="system-ui, sans-serif" font-size="160" font-weight="bold" fill="url(#glow)" text-anchor="middle">G</text>
  <!-- Sparkles -->
  <g fill="#ff00ff">
    <polygon points="100,80 105,100 125,105 105,110 100,130 95,110 75,105 95,100"/>
    <polygon points="420,120 424,136 440,140 424,144 420,160 416,144 400,140 416,136" transform="scale(0.8) translate(100, 50)"/>
    <polygon points="380,380 384,392 396,396 384,400 380,412 376,400 364,396 376,392"/>
  </g>
</svg>
